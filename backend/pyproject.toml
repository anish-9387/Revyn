[project]
name = "revyn-backend"
version = "1.0.0"
description = "Revyn - AI revenue recovery and autonomous revenue protection platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.0.52",
  "aiosqlite==0.22.1",
  "greenlet==3.5.5",
  "httpx==0.28.1",
  "anthropic==1.2.0",
  "numpy==2.5.2",
  "scikit-learn==1.9.0",
  "joblib==1.6.0",
]

[project.optional-dependencies]
postgres = ["asyncpg==0.31.0"]
redis = ["redis==8.1.0"]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Prompt and catalog copy is prose: line breaks there change what the model reads.
"app/integrations/llm/prompts.py" = ["E501"]
"app/data/catalog.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
